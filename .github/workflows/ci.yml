name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS runners are advisory: allocations are occasionally cancelled by
    # GitHub before any step starts. Linux jobs remain the merge gate.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS Apple Clang
            os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update
              sudo apt-get install -y ninja-build
            else
              brew install ninja
            fi
          fi

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCPPQUANT_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke test
        run: ./build/backtest_bench --quick

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCPPQUANT_SANITIZE=ON
          -DCPPQUANT_WERROR=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  thread-sanitizer:
    name: TSan parallel sweeps
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCPPQUANT_TSAN=ON
          -DCPPQUANT_WERROR=ON

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Run parallel tests
        run: ./build-tsan/backtest_tests parallel

  package:
    name: Install and consume package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPPQUANT_BUILD_TESTS=OFF \
            -DCPPQUANT_BUILD_BENCHMARKS=OFF \
            -DCPPQUANT_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/install"

      - name: Build a downstream consumer
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(cppquant_backtest_consumer LANGUAGES CXX)
          find_package(cppquant_backtest CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE cppquant::backtest)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <cppquant/backtest.hpp>
          #include <cassert>
          #include <vector>

          int main() {
            std::vector<cppquant::Bar> bars{
                {0, 100.0, 101.0, 99.0, 100.0, 1000.0},
                {86400, 100.0, 111.0, 99.0, 110.0, 1000.0},
            };
            cppquant::Backtester engine;
            cppquant::BuyAndHoldStrategy strategy(1.0);
            const auto result = engine.run(bars, strategy);
            assert(engine.fills().size() == 1);
            assert(result.final_equity > 0.0);
            return 0;
          }
          EOF
          cmake -S consumer -B consumer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer/build --parallel
          ./consumer/build/consumer
